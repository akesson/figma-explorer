[package]
name = "figma-api"
version = "0.1.0"
description = "Autogenerated Rust client for the Figma REST API."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
serde_with = { version = "3", default-features = false, features = ["base64", "std", "macros"] }
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "rustls"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["reqwest"]
live-tests = []
