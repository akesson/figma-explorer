[package]
name = "figma-api"
version = "0.1.0"
description = "Autogenerated Rust client for the Figma REST API."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_repr.workspace = true
serde_with.workspace = true
url.workspace = true
reqwest = { workspace = true, features = ["json", "multipart", "query"], optional = true }

[dev-dependencies]
tokio.workspace = true

[features]
default = ["reqwest"]
live-tests = []
