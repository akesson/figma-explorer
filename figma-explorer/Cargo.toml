[package]
name = "figma-explorer"
version = "0.1.0"
description = "High-level CLI on top of the Figma REST API: name-based navigation, asset extraction, design tokens, and bundled context export."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/akesson/figma-explorer"
readme = "../README.md"
keywords = ["figma", "cli", "design", "design-tokens"]
categories = ["command-line-utilities"]

[[bin]]
name = "figma-explorer"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
figma-api.workspace = true
figma-common.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml_ng.workspace = true
reqwest.workspace = true
futures.workspace = true
nucleo-matcher.workspace = true
rkyv.workspace = true
memmap2.workspace = true
dirs.workspace = true
tempfile.workspace = true
thiserror.workspace = true
fs2.workspace = true
flate2.workspace = true
