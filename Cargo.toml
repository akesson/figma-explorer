[workspace]
resolver = "2"
members = ["figma-api", "figma-explorer", "figma-get"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/akesson/figma-explorer"

[workspace.dependencies]
figma-api = { path = "figma-api" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
serde_with = { version = "3", default-features = false, features = ["base64", "std", "macros"] }
serde_yaml_ng = "0.10"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
futures = "0.3"
nucleo-matcher = "0.3"
rkyv = "0.8"
memmap2 = "0.9"
dirs = "6"
tempfile = "3"
thiserror = "2"
fs2 = "0.4"
flate2 = "1"
