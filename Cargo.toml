[workspace]
resolver = "2"
members = ["figma-api", "figma-common", "figma-explorer", "figma-get"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/akesson/figma-explorer"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# A GitHub repo to push Homebrew formulas to
tap = "akesson/homebrew-tap"
# Customize the Homebrew formula name
formula = "figma-explorer"
# A namespace to use when publishing this package to the npm registry
npm-scope = "@akesson"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "./publish-npm"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

[workspace.dependencies]
figma-api = { path = "figma-api" }
figma-common = { path = "figma-common" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
serde_with = { version = "3", default-features = false, features = ["base64", "std", "macros"] }
serde_yaml_ng = "0.10"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
futures = "0.3"
nucleo-matcher = "0.3"
rkyv = "0.8"
memmap2 = "0.9"
dirs = "6"
tempfile = "3"
thiserror = "2"
fs2 = "0.4"
flate2 = "1"
twox-hash = { version = "2", features = ["xxhash64"] }
libc = "0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
