# Custom dist "global artifacts" job: submits the codesigned macOS binaries to
# Apple's notary service. Referenced from
# `global-artifacts-jobs = ["./notarize-macos"]` in the root Cargo.toml.
# This file is hand-maintained; it is NOT regenerated by `dist generate`.
#
# Why a custom job: dist 0.32 can codesign (`macos-sign = true`) but has no
# notarization support at all. Signing alone does NOT clear Gatekeeper — an
# unnotarized Developer ID binary still gets "Apple could not verify ... is
# free of malware" on first run after a browser download.
#
# Why this runs here: `dist generate` wires the release-creating `host` job to
# need this one, so a rejected notarization blocks the release instead of
# shipping binaries that fail Gatekeeper.
#
# Why nothing is stapled: `xcrun stapler` only accepts .app/.pkg/.dmg bundles,
# never a bare Mach-O executable or a .tar.xz. The ticket therefore lives only
# on Apple's servers, and Gatekeeper resolves it with an online check on first
# run. That is the normal arrangement for CLI tools shipped as tarballs, and it
# means the artifacts are byte-identical before and after this job — so the
# checksums, Homebrew formula, and npm package computed elsewhere stay valid.
name: Notarize macOS

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  notarize-macos:
    runs-on: macos-14
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Fetch built artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts/
          merge-multiple: true

      - name: Verify macOS binaries are signed for notarization
        id: verify
        run: |
          set -euo pipefail
          mkdir -p staging

          archives=$(jq -r '
            .artifacts | to_entries[]
            | select(.value.kind == "executable-zip")
            | select(any(.value.target_triples[]?; test("apple-darwin")))
            | .key' <<< "$PLAN")

          if [ -z "$archives" ]; then
            echo "::error::No macOS executable archives found in the dist plan."
            exit 1
          fi

          for archive in $archives; do
            echo "::group::$archive"
            if [ ! -f "artifacts/$archive" ]; then
              echo "::error::Expected artifact artifacts/$archive was not built."
              exit 1
            fi
            work=$(mktemp -d)
            tar -xf "artifacts/$archive" -C "$work"

            executables=$(jq -r --arg a "$archive" '
              .artifacts[$a].assets[]
              | select(.kind == "executable") | .name' <<< "$PLAN")

            for exe in $executables; do
              bin=$(find "$work" -type f -name "$exe" -perm -u+x | head -1)
              if [ -z "$bin" ]; then
                echo "::error::$exe not found inside $archive"
                exit 1
              fi

              # Fail before we spend a submission on a binary Apple will reject.
              if ! codesign --verify --strict --verbose=2 "$bin" 2>&1; then
                echo "::error::$exe is not validly signed. Check the CODESIGN_* secrets and macos-sign in Cargo.toml."
                exit 1
              fi
              details=$(codesign --display --verbose=4 "$bin" 2>&1)
              if ! grep -q 'Authority=Developer ID Application' <<< "$details"; then
                echo "$details"
                echo "::error::$exe is not signed with a Developer ID Application certificate; Apple will reject it."
                exit 1
              fi
              if ! grep -qE 'flags=0x[0-9a-f]*\(.*runtime.*\)' <<< "$details"; then
                echo "$details"
                echo "::error::$exe lacks the hardened runtime; Apple will reject it. CODESIGN_OPTIONS=runtime must reach the build job (see .github/workflows/build-setup.yml)."
                exit 1
              fi
              if ! grep -q '^Timestamp=' <<< "$details"; then
                echo "$details"
                echo "::error::$exe has no secure timestamp; Apple will reject it."
                exit 1
              fi

              echo "$exe: Developer ID + hardened runtime + secure timestamp OK"
              cp "$bin" "staging/$exe"
            done
            rm -rf "$work"
            echo "::endgroup::"
          done

      - name: Submit to Apple notary service
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${NOTARY_KEY_BASE64:-}" ] || [ -z "${NOTARY_KEY_ID:-}" ] || [ -z "${NOTARY_ISSUER_ID:-}" ]; then
            echo "::error::Missing NOTARY_KEY_BASE64 / NOTARY_KEY_ID / NOTARY_ISSUER_ID secrets."
            exit 1
          fi

          key=$(mktemp -t notary_key)
          trap 'rm -f "$key"' EXIT
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$key"

          # notarytool takes .zip/.pkg/.dmg, never a bare binary or .tar.xz.
          # One zip of every macOS executable is one submission; Apple
          # notarizes each Mach-O it contains.
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent staging payload.zip

          set +e
          /usr/bin/xcrun notarytool submit payload.zip \
            --key "$key" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m \
            --output-format json > result.json
          submit_exit=$?
          set -e
          cat result.json

          # `--wait` exits 0 for a completed-but-rejected submission, so the
          # status field is the real verdict, not the exit code.
          status=$(jq -r '.status // "unknown"' result.json)
          id=$(jq -r '.id // empty' result.json)
          if [ "$status" != "Accepted" ]; then
            echo "::error::Notarization $status (notarytool exit $submit_exit)"
            if [ -n "$id" ]; then
              echo "::group::Apple notary log"
              /usr/bin/xcrun notarytool log "$id" \
                --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
              echo "::endgroup::"
            fi
            exit 1
          fi
          echo "Notarization accepted (submission $id)."
