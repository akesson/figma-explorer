# Custom cargo-dist publish job: publishes the npm package via npm Trusted
# Publishing (OIDC) instead of a long-lived NPM_TOKEN. Referenced from
# `publish-jobs = ["./publish-npm"]` in the root Cargo.toml. This file is
# hand-maintained; it is NOT regenerated by `dist generate`.
name: Publish npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-npm:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write # required for OIDC trusted publishing
      contents: read
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Fetch npm packages
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: npm/
          merge-multiple: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1; Node 22's bundled npm may be older.
      - run: npm install -g npm@latest
      - run: npm --version
      # No NODE_AUTH_TOKEN here on purpose: if a token is present npm uses it
      # instead of OIDC.
      - run: |
          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith("-npm-package.tar.gz")] | any)'); do
            pkg=$(echo "$release" | jq '.artifacts[] | select(endswith("-npm-package.tar.gz"))' --raw-output)
            npm publish --access public "./npm/${pkg}"
          done
